<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#07060d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>액팅 소울 : 0 — 신들의 종언 (시즌 2 체험판)</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;background:#07060d;overflow:hidden;color:#e9e6f5;
  font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;touch-action:none;overscroll-behavior:none}
canvas{position:fixed;inset:0;display:block}
.hide{display:none!important}
button{font-family:inherit;color:inherit}
#ui{position:fixed;inset:0;pointer-events:none}
#ui>*{pointer-events:auto}

/* ---------- title ---------- */
#title{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2vh;padding:4vh 4vw}
#title img{width:min(78vw,620px,90vh);filter:drop-shadow(0 0 24px rgba(150,110,255,.45));animation:float 5s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-6px)}}
#title .sub{letter-spacing:.35em;font-size:clamp(12px,1.8vmin,16px);color:#b9b0dc;text-align:center}
#title .sub b{display:block;font-size:clamp(18px,3.6vmin,30px);letter-spacing:.25em;color:#efeaff;margin-bottom:.5vh;font-weight:800;
  text-shadow:0 0 18px rgba(170,130,255,.7)}
.menu{display:flex;flex-direction:column;gap:10px;margin-top:1vh;min-width:min(64vw,280px)}
.btn{pointer-events:auto;cursor:pointer;border:1px solid rgba(160,140,255,.45);background:linear-gradient(180deg,rgba(40,30,80,.75),rgba(15,12,30,.85));
  padding:12px 22px;border-radius:10px;font-size:clamp(14px,2.2vmin,17px);letter-spacing:.12em;font-weight:700;
  box-shadow:0 0 18px rgba(120,90,255,.18),inset 0 0 12px rgba(150,120,255,.12);transition:transform .1s}
.btn:active{transform:scale(.97)}
.btn.gold{border-color:rgba(255,215,140,.6);background:linear-gradient(180deg,rgba(90,60,20,.7),rgba(30,18,8,.85))}
.btn[disabled]{opacity:.35}
.ver{position:absolute;right:12px;bottom:10px;font-size:11px;color:#7d7699;letter-spacing:.1em;pointer-events:none}
.hint{font-size:12px;color:#8f88b0;text-align:center;line-height:1.6}

/* ---------- chapter select ---------- */
#chap{position:absolute;inset:0;background:rgba(5,4,12,.82);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:20px}
#chap h2{margin:0 0 6px;letter-spacing:.3em;font-size:18px;color:#cfc6ff}
#chap .list{display:flex;flex-direction:column;gap:10px;width:min(86vw,440px)}
#chap .list .btn{text-align:left;display:flex;flex-direction:column;gap:3px}
#chap .list .btn small{font-weight:500;letter-spacing:.04em;color:#a9a2c9;font-size:12px}

/* ---------- card ---------- */
#card{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,rgba(30,20,60,.55),rgba(3,2,8,.92));
  opacity:0;transition:opacity .6s}
#card.on{opacity:1}
#card .n{font-size:clamp(13px,2vmin,16px);letter-spacing:.6em;color:#a99be8;margin-bottom:12px}
#card .t{font-size:clamp(22px,4.6vmin,40px);font-weight:800;letter-spacing:.12em;text-align:center;padding:0 6vw;
  background:linear-gradient(90deg,#c6b2ff,#ffffff,#9fd8ff);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 12px rgba(150,120,255,.5))}
#card .line{width:min(60vw,420px);height:1px;margin-top:16px;background:linear-gradient(90deg,transparent,#a58cff,transparent)}

/* ---------- dialog ---------- */
#dlg{position:absolute;inset:0;padding:0 max(12px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));
  display:flex;align-items:flex-end;gap:0;cursor:pointer}
#dlg .por{position:relative;width:min(30vmin,190px);height:min(36vmin,228px);flex:none;margin-right:-10px;z-index:2;display:flex;align-items:flex-end;justify-content:center}
#dlg .por img{max-height:100%;max-width:100%;border-radius:12px 12px 0 0;-webkit-mask-image:linear-gradient(180deg,#000 70%,transparent);mask-image:linear-gradient(180deg,#000 70%,transparent)}
#dlg .emb{width:min(17vmin,104px);height:min(17vmin,104px);margin-bottom:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:min(7vmin,44px);font-weight:800;border:2px solid currentColor;background:radial-gradient(circle,rgba(255,255,255,.08),rgba(0,0,0,.6));
  box-shadow:0 0 22px currentColor inset,0 0 14px rgba(0,0,0,.6)}
#dlg .box{flex:1;min-height:min(30vmin,170px);background:linear-gradient(180deg,rgba(14,11,28,.88),rgba(6,5,14,.95));border:1px solid rgba(150,130,255,.35);
  border-radius:14px;padding:14px 18px 26px 22px;position:relative;box-shadow:0 0 30px rgba(0,0,0,.6),inset 0 0 22px rgba(120,90,255,.08)}
#dlg .nm{font-weight:800;font-size:clamp(14px,2.4vmin,18px);letter-spacing:.08em;margin-bottom:6px}
#dlg .tx{font-size:clamp(14px,2.5vmin,18px);line-height:1.65;white-space:pre-wrap;word-break:keep-all}
#dlg.nar .tx{color:#cfc9e6;font-style:italic}
#dlg.sys .tx{color:#8fd8ff;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:clamp(13px,2.2vmin,16px)}
#dlg .nx{position:absolute;right:14px;bottom:8px;font-size:12px;color:#9d93d8;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.25}}
#dlgbar{position:absolute;top:max(10px,env(safe-area-inset-top));right:max(10px,env(safe-area-inset-right));display:flex;gap:8px}
.sbtn{pointer-events:auto;border:1px solid rgba(160,140,255,.4);background:rgba(10,8,22,.7);padding:7px 12px;border-radius:8px;font-size:12px;letter-spacing:.1em;cursor:pointer}
.sbtn.on{background:rgba(110,80,220,.6)}

/* ---------- HUD ---------- */
#hud{position:absolute;inset:0;pointer-events:none}
#hud *{pointer-events:none}
#pl{position:absolute;left:max(10px,env(safe-area-inset-left));top:max(8px,env(safe-area-inset-top));width:min(29vw,250px)}
.pname{font-size:12px;font-weight:800;letter-spacing:.08em;display:flex;justify-content:space-between;white-space:nowrap;gap:6px}
.pname span{font-weight:500;color:#aaa3c9}
.bar{height:9px;background:rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.18);border-radius:5px;overflow:hidden;margin:3px 0 5px}
.bar i{display:block;height:100%;width:100%;transition:width .12s}
#hpE i{background:linear-gradient(90deg,#6b5cff,#9fd8ff)}
#hpN i{background:linear-gradient(90deg,#9fd8ff,#ffffff)}
.mini{opacity:.8}
.mini .bar{height:5px}
#lk{height:8px}
#lk i{background:linear-gradient(90deg,#8a5cff,#c9b6ff,#9fe2ff)}
#lk.full i{animation:lkp .6s infinite alternate}
@keyframes lkp{to{filter:brightness(1.6)}}
#boss{position:absolute;left:50%;transform:translateX(-50%);top:max(8px,env(safe-area-inset-top));width:min(36vw,440px);text-align:center}
#boss .bn{font-size:12px;font-weight:800;letter-spacing:.12em;text-shadow:0 0 8px #000}
#boss .bn small{font-weight:500;color:#c9b6ff;margin-left:6px;font-size:11px}
#boss .bar{height:10px}
#boss .bar i{background:linear-gradient(90deg,#7a1fff,#d77cff)}
#obj{position:absolute;left:50%;transform:translateX(-50%);top:max(8px,env(safe-area-inset-top));font-size:12px;letter-spacing:.08em;color:#e8e2ff;text-shadow:0 0 6px #000;text-align:center;width:min(36vw,420px)}
#core .bar i{background:linear-gradient(90deg,#ff7a4d,#ffd27a)}
#banner{position:absolute;left:50%;top:22%;transform:translateX(-50%);width:min(88vw,620px);text-align:center;font-size:clamp(13px,2.3vmin,17px);line-height:1.55;
  background:linear-gradient(90deg,transparent,rgba(10,20,40,.85) 15%,rgba(10,20,40,.85) 85%,transparent);padding:10px 30px;color:#cfeaff;opacity:0;transition:opacity .3s;word-break:keep-all}
#banner.on{opacity:1}
#banner b{color:#8fd8ff}
#banner .skp{pointer-events:auto;margin-top:6px}
#barks{position:absolute;left:max(10px,env(safe-area-inset-left));top:34%;display:flex;flex-direction:column;gap:6px;width:min(52vw,340px)}
.bk{background:rgba(8,6,18,.78);border-left:3px solid currentColor;padding:6px 10px;border-radius:0 8px 8px 0;font-size:12.5px;line-height:1.45;animation:bkin .25s ease-out;word-break:keep-all}
.bk b{display:block;font-size:11px;letter-spacing:.08em}
.bk span{color:#ece8ff}
@keyframes bkin{from{transform:translateX(-20px);opacity:0}}
#combo{position:absolute;right:max(14px,env(safe-area-inset-right));top:20%;text-align:right;font-weight:900;font-size:clamp(20px,4vmin,34px);color:#fff;
  text-shadow:0 0 10px #8a5cff;opacity:0;transition:opacity .2s}
#combo small{display:block;font-size:11px;letter-spacing:.3em;color:#c9b6ff}
#pauseB{position:absolute;right:max(10px,env(safe-area-inset-right));top:max(8px,env(safe-area-inset-top));pointer-events:auto!important;width:38px;height:38px;border-radius:50%;
  border:1px solid rgba(160,140,255,.45);background:rgba(10,8,22,.7);font-size:14px;cursor:pointer}

/* ---------- controls ---------- */
#ctrl{position:absolute;inset:0;pointer-events:none}
#joy{position:absolute;left:0;bottom:0;width:48%;height:72%;pointer-events:auto;touch-action:none}
#joyB,#joyK{position:absolute;border-radius:50%;pointer-events:none;opacity:0;transition:opacity .15s}
#joyB{width:120px;height:120px;margin:-60px 0 0 -60px;border:2px solid rgba(170,150,255,.35);background:rgba(30,20,60,.25)}
#joyK{width:54px;height:54px;margin:-27px 0 0 -27px;background:radial-gradient(circle,rgba(200,185,255,.7),rgba(110,80,220,.45));box-shadow:0 0 14px rgba(150,120,255,.6)}
#joyHint{position:absolute;left:max(18px,env(safe-area-inset-left));bottom:max(18px,env(safe-area-inset-bottom));width:110px;height:110px;border-radius:50%;
  border:2px dashed rgba(170,150,255,.22);display:flex;align-items:center;justify-content:center;font-size:11px;color:rgba(200,190,255,.45);pointer-events:none}
#btns{position:absolute;right:max(14px,env(safe-area-inset-right));bottom:max(14px,env(safe-area-inset-bottom));width:232px;height:212px;pointer-events:none}
.cb{position:absolute;pointer-events:auto;touch-action:none;border-radius:50%;border:2px solid rgba(180,160,255,.5);background:radial-gradient(circle at 50% 35%,rgba(70,50,140,.75),rgba(14,10,30,.85));
  display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;font-size:12px;letter-spacing:.04em;color:#efeaff;cursor:pointer;overflow:hidden}
.cb small{font-size:9px;font-weight:600;opacity:.75;letter-spacing:.02em}
.cb.press{transform:scale(.93);filter:brightness(1.35)}
.cb .cd{position:absolute;inset:0;background:rgba(0,0,0,.62);display:flex;align-items:center;justify-content:center;font-size:16px;color:#fff}
#bAtk{width:92px;height:92px;right:0;bottom:0;font-size:15px;border-color:rgba(200,180,255,.75)}
#bDash{width:60px;height:60px;right:104px;bottom:0}
#bSkill{width:60px;height:60px;right:96px;bottom:70px}
#bTag{width:56px;height:56px;right:36px;bottom:104px}
#bLink{width:56px;height:56px;right:150px;bottom:136px;border-color:rgba(255,220,150,.45)}
#bLink.full{border-color:#ffe08a;box-shadow:0 0 18px rgba(255,210,120,.8);animation:lkp .5s infinite alternate}
#keys{position:absolute;left:50%;transform:translateX(-50%);bottom:8px;font-size:11px;color:#7d7699;letter-spacing:.06em;white-space:nowrap}

/* ---------- overlays ---------- */
.ov{position:absolute;inset:0;background:rgba(4,3,10,.82);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:20px;text-align:center}
.ov h2{margin:0;font-size:clamp(22px,4.4vmin,36px);letter-spacing:.2em}
.ov .stats{display:grid;grid-template-columns:auto auto;gap:6px 22px;font-size:14px;color:#cdc6ee;margin:6px 0 8px}
.ov .stats b{color:#fff;text-align:right}
.rank{font-size:56px;font-weight:900;background:linear-gradient(180deg,#fff,#b48cff);-webkit-background-clip:text;background-clip:text;color:transparent}
#rot{position:absolute;left:50%;top:44%;animation:fo 1s 5s forwards;transform:translateX(-50%);font-size:11px;color:#a49dc8;background:rgba(10,8,22,.7);padding:5px 10px;border-radius:8px;pointer-events:none}
@keyframes fo{to{opacity:0}}
@media (pointer:coarse),(max-width:700px){#keys{display:none}}
@media (max-aspect-ratio:1/1){
  #pl{width:44vw}
  .pname{font-size:11px;letter-spacing:.02em}
  #boss,#obj{left:auto;right:calc(max(10px,env(safe-area-inset-right)) + 46px);transform:none;width:calc(52vw - 60px)}
  #boss .bn small{display:block;margin:0}
  #barks{top:30%}
}
#flash{position:absolute;inset:0;pointer-events:none!important;background:#fff;opacity:0}
</style>
</head>

function resize(){

  W=window.innerWidth;H=window.innerHeight;
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
  cv.style.width=W+'px';cv.style.height=H+'px';
  ZOOM=Math.min(W,H)/450;

let AC=null,NB=null;
function audioInit(){
  if(AC)return;
  try{AC=new (window.AudioContext||window.webkitAudioContext)();
    const len=AC.sampleRate*0.5;NB=AC.createBuffer(1,len,AC.sampleRate);const d=NB.getChannelData(0);
    for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
  }catch(e){AC=null;}
}
function tone(f,d,type,v,slide,delay){
  if(!AC||!SAVE.snd)return;
  const t=AC.currentTime+(delay||0);
  const o=AC.createOscillator(),g=AC.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(20,f+slide),t+d);
  g.gain.setValueAtTime(v||0.1,t);g.gain.exponentialRampToValueAtTime(0.0008,t+d);
  o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+0.03);
}
function noise(d,v,freq,delay){
  if(!AC||!SAVE.snd||!NB)return;
  const t=AC.currentTime+(delay||0);
  const s=AC.createBufferSource();s.buffer=NB;
  const f=AC.createBiquadFilter();f.type='bandpass';f.frequency.value=freq||1200;f.Q.value=0.8;
  const g=AC.createGain();g.gain.setValueAtTime(v||0.1,t);g.gain.exponentialRampToValueAtTime(0.0008,t+d);
  s.connect(f);f.connect(g);g.connect(AC.destination);s.start(t);s.stop(t+d+0.03);
}

const KEYMAP={KeyJ:'atk',KeyK:'dash',Space:'dash',KeyL:'skill',KeyQ:'tag',KeyE:'link',ShiftLeft:'dash'};
window.addEventListener('keydown',e=>{
  audioInit();
  if(e.repeat){keys[e.code]=true;return;}
  keys[e.code]=true;
  const a=KEYMAP[e.code];
  if(a&&GS.mode==='battle'){if(a==='atk')inp.atk=true;else inp[a+'P']=true;e.preventDefault();}
  if(e.code==='Escape'||e.code==='KeyP'){if(GS.mode==='battle')togglePause();}
  if((e.code==='Enter'||e.code==='Space')&&GS.mode==='dialog'){dlgAdvance();e.preventDefault();}
});
window.addEventListener('keyup',e=>{keys[e.code]=false;if(KEYMAP[e.code]==='atk')inp.atk=false;});
window.addEventListener('blur',()=>{for(const k in keys)keys[k]=false;inp.atk=false;inp.jx=inp.jy=0;});

(function setupJoy(){
  const z=$('joy'),b=$('joyB'),k=$('joyK');let id=null,ox=0,oy=0;
  z.addEventListener('pointerdown',e=>{audioInit();id=e.pointerId;z.setPointerCapture(id);ox=e.clientX;oy=e.clientY;
    b.style.left=k.style.left=ox+'px';b.style.top=k.style.top=oy+'px';b.style.opacity=k.style.opacity=1;inp.jx=inp.jy=0;$('joyHint').style.opacity=0;e.preventDefault();});
  z.addEventListener('pointermove',e=>{if(e.pointerId!==id)return;let dx=e.clientX-ox,dy=e.clientY-oy;const l=Math.hypot(dx,dy),R=50;
    if(l>R){dx*=R/l;dy*=R/l;}k.style.left=ox+dx+'px';k.style.top=oy+dy+'px';inp.jx=dx/R;inp.jy=dy/R;if(l<8){inp.jx=inp.jy=0;}});
  const up=e=>{if(e.pointerId!==id)return;id=null;inp.jx=inp.jy=0;b.style.opacity=k.style.opacity=0;};
  z.addEventListener('pointerup',up);z.addEventListener('pointercancel',up);
})();
document.querySelectorAll('.cb').forEach(el=>{
  const a=el.dataset.a;
  el.addEventListener('pointerdown',e=>{audioInit();el.setPointerCapture(e.pointerId);el.classList.add('press');
    if(a==='atk')inp.atk=true;else inp[a+'P']=true;e.preventDefault();});
  const up=()=>{el.classList.remove('press');if(a==='atk')inp.atk=false;};
  el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);el.addEventListener('lostpointercapture',up);
});
function readMove(){
  let x=0,y=0;
  if(keys.KeyA||keys.ArrowLeft)x-=1;if(keys.KeyD||keys.ArrowRight)x+=1;
  if(keys.KeyW||keys.ArrowUp)y-=1;if(keys.KeyS||keys.ArrowDown)y+=1;
  if(x||y){const l=Math.hypot(x,y);x/=l;y/=l;}else{x=inp.jx;y=inp.jy;}
  inp.mx=x;inp.my=y;
}
function clearPresses(){inp.dashP=inp.skillP=inp.tagP=inp.linkP=false;}

function parseScript(src){
  return src.split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{
    if(l.startsWith('#card ')){const[a,b]=l.slice(6).split('|');return{t:'card',n:a,x:b};}
    if(l.startsWith('@bg '))return{t:'bg',bg:l.slice(4).trim()};
    if(l.startsWith('!battle '))return{t:'battle',id:l.slice(8).trim()};
    if(l==='!end')return{t:'end'};
    if(l.startsWith('> '))return{t:'nar',x:l.slice(2)};
    if(l.startsWith('[sys] '))return{t:'sys',x:'[ '+l.slice(6)+' ]'};
    const i=l.indexOf(': ');
    if(i>0&&i<12)return{t:'say',n:l.slice(0,i),x:l.slice(i+2)};
    return{t:'nar',x:l};
  });
}
const SCRIPT={};for(const k in RAW)SCRIPT[k]=parseScript(RAW[k]);

  const st=list[run.i++];
  if(!st){
    if(run.ch+1>SAVE.unlocked){SAVE.unlocked=run.ch+1;persist();}
    if(SCRIPT[run.ch+1])startChapter(run.ch+1);else finish();
    return;
  }
  if(st.t==='bg'){GS.bg=st.bg;GS.bgT=0;return nextStep();}
  if(st.t==='card'){showCard(st);return;}
  if(st.t==='battle'){hideDialog();startBattle(st.id);return;}
  if(st.t==='end'){hideDialog();finish();return;}
  showLine(st);
}
function showCard(st){
  hideDialog();GS.mode='card';
  $('cardN').textContent=st.n;$('cardT').textContent=st.x;
  const c=$('card');show('card',true);requestAnimationFrame(()=>c.classList.add('on'));
  SFX.boss();
  let done=false;
  const go=()=>{if(done)return;done=true;c.classList.remove('on');c.onclick=null;setTimeout(()=>{show('card',false);nextStep();},450);};
  c.onclick=go;setTimeout(go,2600);
}
function showLine(st){
  GS.mode='dialog';D.step=st;
  show('dlg',true);show('dlgbar',true);
  const dl=$('dlg');dl.classList.toggle('nar',st.t==='nar');dl.classList.toggle('sys',st.t==='sys');
  const por=$('dPor');por.innerHTML='';
  if(st.t==='say'){
    const s=SPK[st.n]||{c:'#ddd',e:st.n[0],full:st.n};
    $('dNm').textContent=s.full;$('dNm').style.color=s.c;
    if(s.img&&IMG[s.img]){const im=document.createElement('img');im.src=IMG_SRC[s.img];por.appendChild(im);}
    else{const e=document.createElement('div');e.className='emb';e.style.color=s.c;e.textContent=s.e||st.n[0];por.appendChild(e);}
    por.style.display='';
  }else{$('dNm').textContent=st.t==='sys'?'SYSTEM':'';$('dNm').style.color='#8fd8ff';por.style.display='none';}
  D.full=st.x;D.shown=0;D.typing=true;D.autoT=0;$('dTx').textContent='';
}
function hideDialog(){show('dlg',false);show('dlgbar',false);}
function dlgAdvance(){
  if(GS.mode!=='dialog')return;
  if(D.typing){D.shown=D.full.length;D.typing=false;$('dTx').textContent=D.full;return;}
  SFX.ui();nextStep();
}
function dlgUpdate(dt){
  if(GS.mode!=='dialog')return;
  if(D.typing){
    const before=Math.floor(D.shown);D.shown+=dt*42;
    if(Math.floor(D.shown)!==before){SFX.text();}
    if(D.shown>=D.full.length){D.shown=D.full.length;D.typing=false;}
    $('dTx').textContent=D.full.slice(0,Math.floor(D.shown));
  }else if(D.auto){D.autoT+=dt;if(D.autoT>1.2+D.full.length*0.03)dlgAdvance();}
}
function skipToAction(){
  const list=SCRIPT[run.ch];
  while(run.i<list.length){const st=list[run.i];
    if(st.t==='bg'){GS.bg=st.bg;run.i++;continue;}
    if(st.t==='say'||st.t==='nar'||st.t==='sys'){run.i++;continue;}
    break;}
  nextStep();
}
$('dlg').addEventListener('click',()=>{audioInit();dlgAdvance();});
$('bSkip').addEventListener('click',e=>{e.stopPropagation();SFX.ui();skipToAction();});
$('bAuto').addEventListener('click',e=>{e.stopPropagation();D.auto=!D.auto;$('bAuto').classList.toggle('on',D.auto);});

function finish(){GS.mode='fin';GS.bg='title';hideDialog();show('fin',true);SFX.win();}

const BGP=[];for(let i=0;i<90;i++)BGP.push({x:Math.random(),y:Math.random(),s:Math.random(),v:rand(.2,1)});
function sgrad(c1,c2){const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,c1);g.addColorStop(1,c2);ctx.fillStyle=g;ctx.fillRect(0,0,W,H);}
function glow(x,y,r,col,a){const g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,col);g.addColorStop(1,'rgba(0,0,0,0)');ctx.globalAlpha=a==null?1:a;ctx.fillStyle=g;ctx.fillRect(x-r,y-r,r*2,r*2);ctx.globalAlpha=1;}
function gateSky(x,y,s,t){
  ctx.save();ctx.translate(x,y);
  glow(0,0,s*1.6,'rgba(150,150,170,.35)');
  ctx.strokeStyle='rgba(210,210,230,.55)';ctx.lineWidth=2;ctx.beginPath();
  for(let i=0;i<7;i++){const a=i/7*TAU+t*.05;ctx.moveTo(0,0);let px=0,py=0;for(let k=1;k<5;k++){px+=Math.cos(a+Math.sin(k*3+i)*.6)*s*.22;py+=Math.sin(a+Math.cos(k*2+i)*.6)*s*.12;ctx.lineTo(px,py);}}
  ctx.stroke();ctx.fillStyle='rgba(20,18,28,.9)';ctx.beginPath();ctx.ellipse(0,0,s*.32,s*.1,0,0,TAU);ctx.fill();
  ctx.restore();
}
function particles(col,dir,t,amt){
  ctx.fillStyle=col;
  for(let i=0;i<(amt||BGP.length);i++){const p=BGP[i];
    let y=(p.y+t*.03*p.v*dir)%1;if(y<0)y+=1;const x=(p.x+Math.sin(t*.3+i)*.01);
    ctx.globalAlpha=.25+.5*p.s;ctx.fillRect(x*W,y*H,1+p.s*2,1+p.s*2);}
  ctx.globalAlpha=1;
}
function skyline(base,col,seed,hmax,win){
  ctx.fillStyle=col;let x=0,i=0;
  while(x<W){const w=30+((seed*(i+3)*7919)%60);const h=hmax*(.35+(((seed+i)*4271)%100)/150);
    ctx.fillRect(x,base-h,w,h);
    if(win){ctx.fillStyle=win;for(let yy=base-h+8;yy<base-6;yy+=12)for(let xx=x+5;xx<x+w-6;xx+=10)if(((xx*31+yy*17+seed)%7)<2)ctx.fillRect(xx,yy,3,4);ctx.fillStyle=col;}
    x+=w+2;i++;}
}
function drawBg(key,t){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  const m=Math.min(W,H);
  switch(key){
  case 'title':{
    sgrad('#0b0818','#020106');
    glow(W/2,H*.45,m*.8,'rgba(110,70,220,.35)');
    ctx.save();ctx.translate(W/2,H*.45);
    for(let i=0;i<5;i++){ctx.rotate(t*.05*(i%2?1:-1));ctx.strokeStyle=`rgba(${160+i*15},${120+i*20},255,${.12+.03*i})`;ctx.lineWidth=1;
      ctx.beginPath();ctx.ellipse(0,0,m*(.25+i*.09),m*(.25+i*.09)*.92,0,0,TAU);ctx.stroke();}
    ctx.restore();particles('#b9a4ff',-1,t);break;}
  case 'tower':{
    sgrad('#120a24','#030208');glow(W/2,H*.42,m*.6,'rgba(140,60,255,.45)');
    ctx.strokeStyle='rgba(200,200,220,.35)';ctx.lineWidth=3;
    for(let i=0;i<9;i++){const a=i/9*TAU+Math.sin(t*.4+i)*.05;ctx.setLineDash([10,6]);ctx.beginPath();ctx.moveTo(W/2,H*.42);ctx.lineTo(W/2+Math.cos(a)*m,H*.42+Math.sin(a)*m);ctx.stroke();}
    ctx.setLineDash([]);
    ctx.fillStyle='#000';ctx.beginPath();ctx.arc(W/2,H*.42,m*.07+Math.sin(t*2)*3,0,TAU);ctx.fill();
    ctx.strokeStyle='rgba(180,120,255,.8)';ctx.lineWidth=2;ctx.stroke();
    particles('#c9b6ff',-1,t);break;}
  case 'forge':{
    sgrad('#2a2a33','#0f0c0b');gateSky(W*.72,H*.16,m*.5,t);
    ctx.fillStyle='#17110e';ctx.fillRect(0,H*.55,W,H*.45);
    glow(W*.2,H*.72,m*.45,'rgba(255,120,40,.45)',.7+Math.sin(t*5)*.08);
    ctx.fillStyle='#0b0807';ctx.fillRect(W*.42,H*.66,W*.16,H*.05);ctx.fillRect(W*.47,H*.71,W*.06,H*.1);ctx.fillRect(W*.43,H*.81,W*.14,H*.03);
    ctx.fillStyle='#1c1512';ctx.fillRect(0,H*.2,W*.06,H*.4);ctx.fillRect(W*.94,H*.2,W*.06,H*.4);

    ctx.strokeStyle='rgba(60,170,255,.22)';ctx.lineWidth=1;

    for(let k=0;k<10;k++){const y=hz+(H-hz)*Math.pow((k+(t*.4)%1)/10,2);ctx.globalAlpha=.5;ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
    ctx.globalAlpha=1;
    if(key==='ark'){
      ctx.fillStyle='#d8e6f5';ctx.fillRect(W*.47,H*.08,W*.06,hz-H*.08);glow(W*.5,H*.1,m*.25,'rgba(80,190,255,.6)',.6+Math.sin(t*3)*.3);
      ctx.fillStyle='#0b1a2e';ctx.beginPath();ctx.ellipse(W*.8,hz,W*.16,H*.2,0,PI,TAU);ctx.fill();
      ctx.fillStyle='#0b1a2e';ctx.fillRect(W*.06,hz-H*.16,W*.18,H*.16);glow(W*.15,hz-H*.05,m*.15,'rgba(255,140,60,.35)');
      for(let i=0;i<14;i++){const x=(i*137%100)/100*W,y=H*.2+((i*71+t*12)%(H*.3));ctx.strokeStyle='rgba(120,210,255,.5)';ctx.strokeRect(x,y,7,7);}
    }else{
      ctx.strokeStyle='rgba(80,200,255,.5)';ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(W/2,H*.78,W*.32,H*.08,0,0,TAU);ctx.stroke();
      glow(W/2,H*.78,m*.4,'rgba(60,160,255,.25)');
    }
    particles('#7fd0ff',-1,t,40);break;}
  case 'plaza':{
    sgrad('#2a2347','#0d0b16');gateSky(W*.5,H*.12,m*.45,t);
    skyline(H*.66,'#141024',7,H*.38,'rgba(255,210,140,.75)');

    for(let i=0;i<26;i++){const x=((i*97+t*(i%2?8:-6))%W+W)%W,y=H*.74+(i%4)*H*.05;ctx.fillStyle='#07060c';ctx.beginPath();ctx.arc(x,y,5,0,TAU);ctx.fill();ctx.fillRect(x-4,y+4,8,14);}
    break;}
  case 'unity':case 'alert':{
    sgrad('#2b1c12','#0e0906');
    ctx.fillStyle='#1d140d';ctx.fillRect(0,H*.6,W,H*.4);
    for(let i=0;i<5;i++){glow(W*(i+.5)/5,H*.12,m*.2,'rgba(255,190,110,.5)');}
    ctx.fillStyle='#100b07';for(let i=0;i<4;i++){ctx.fillRect(W*(.08+i*.24),H*.7,W*.16,H*.03);ctx.fillRect(W*(.1+i*.24),H*.73,W*.015,H*.08);ctx.fillRect(W*(.21+i*.24),H*.73,W*.015,H*.08);}
    ctx.fillStyle='#0a0e18';ctx.fillRect(W*.3,H*.18,W*.4,H*.26);ctx.strokeStyle='rgba(120,190,255,.5)';ctx.strokeRect(W*.3,H*.18,W*.4,H*.26);
    if(key==='alert'){const a=.25+.25*Math.sin(t*6);ctx.fillStyle=`rgba(255,30,40,${a})`;ctx.fillRect(0,0,W,H);
      ctx.fillStyle='#ff4d5a';ctx.font=`800 ${Math.max(14,m*.05)}px sans-serif`;ctx.textAlign='center';ctx.fillText('⚠ WARNING — 제1 전초기지',W/2,H*.33);}
    break;}
  case 'outpost':{
    sgrad('#3a1a14','#0f0807');glow(W*.5,H*.3,m*.7,'rgba(255,90,40,.25)');
    ctx.strokeStyle='rgba(255,180,120,.35)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(W/2,H*.85,m*.55,PI,TAU);ctx.stroke();

/* ---------- hazards ---------- */
function addHaz(h){h.t0=h.t;h.life=h.life||0;h.col=h.col||'255,60,90';B.haz.push(h);if(h.t>0.3)SFX.warn();return h;}
function inHaz(h,o,pad){
  pad=pad||0;
  const dx=o.x-h.x,dy=o.y-h.y,d=Math.hypot(dx,dy);
  switch(h.k){
    case 'circle':return d<=h.r+pad;
    case 'ring':return d<=h.r+pad&&d>=h.r2-pad;
    case 'cone':return d<=h.r+pad&&Math.abs(angDiff(h.ang,Math.atan2(dy,dx)))<=h.arc/2;
    case 'line':{const c=Math.cos(h.ang),s=Math.sin(h.ang);const al=dx*c+dy*s,pe=Math.abs(-dx*s+dy*c);return al>=-pad&&al<=h.len+pad&&pe<=h.w/2+pad;}
  }
  return false;
}
function hazHit(h){
  if(!h.hitP&&inHaz(h,P,P.r*.6)){h.hitP=1;hurtPlayer(h.dmg,h);}
  for(const a of B.allies)if(a.hp>0&&!(h.hitA&&h.hitA.has(a))&&inHaz(h,a,a.r*.5)){(h.hitA||(h.hitA=new Set())).add(a);hurtAlly(a,h.dmg*.6);}
  if(B.core&&!h.hitC&&inHaz(h,B.core,B.core.r*.6)){h.hitC=1;hurtCore(h.dmg*(h.coreMul||1));}
}
function updateHaz(dt){
  for(const h of B.haz){
    if(h.owner&&!h.owner.alive&&!h.fired){h.dead=1;continue;}
    if(h.t>0){h.t-=dt;if(h.t<=0){h.fired=1;hazHit(h);if(h.onFire)h.onFire(h);fxHaz(h);}}
    else{h.life-=dt;if(h.life>0)hazHit(h);else h.dead=1;}
    if(h.fired&&h.life<=0)h.dead=1;
  }
  B.haz=B.haz.filter(h=>!h.dead);
}
function fxHaz(h){
  const col=h.fxc||'#ff5a7a';
  if(h.k==='circle'||h.k==='ring'){B.fx.push({k:'ring',x:h.x,y:h.y,r:h.r*.4,r2:h.r*1.05,life:.3,max:.3,col});}
  for(let i=0;i<8;i++){let x=h.x,y=h.y;if(h.k==='line'){const t=Math.random()*h.len;x+=Math.cos(h.ang)*t;y+=Math.sin(h.ang)*t;}else if(h.k==='cone'){const a=h.ang+rand(-h.arc/2,h.arc/2),rr=rand(0,h.r);x+=Math.cos(a)*rr;y+=Math.sin(a)*rr;}else{const a=rand(0,TAU),rr=rand(h.r2||0,h.r);x+=Math.cos(a)*rr;y+=Math.sin(a)*rr;}
    B.fx.push({k:'p',x,y,vx:rand(-60,60),vy:rand(-90,-10),life:.4,max:.4,col,s:3});}
  if(h.big){B.shake=Math.max(B.shake,8);SFX.boom();}
}

/* ---------- player ---------- */
function other(){return P.active==='eden'?'nesis':'eden';}
function nearestEnemy(x,y,maxd,filter){let best=null,bd=maxd||1e9;for(const e of B.en){if(!e.alive||e.inv||e.spawnT>0)continue;if(filter&&!filter(e))continue;const d=Math.hypot(e.x-x,e.y-y)-e.r;if(d<bd){bd=d;best=e;}}return best;}
function updatePlayer(dt){
  const c=CH[P.active];
  readMove();
  const mx=inp.mx,my=inp.my;
  if(B.tut&&(mx||my))B.tut.moved+=c.spd*dt;
  P.walk+=dt*(mx||my?1:0);
  if(P.dashT>0){P.x+=P.dvx*dt;P.y+=P.dvy*dt;P.dashT-=dt;
    if(Math.random()<.8)B.fx.push({k:'ghost',x:P.x,y:P.y,who:P.active,face:P.face,life:.22,max:.22});}
  else{
    const sp=c.spd*(P.atkT>0?0.3:1);
    P.x+=mx*sp*dt;P.y+=my*sp*dt;
    if((mx||my)&&P.atkT<=0)P.face=Math.atan2(my,mx);
  }
  P.x=clamp(P.x,24,B.w-24);P.y=clamp(P.y,24,B.h-24);
  if(P.dashT<=0)for(const e of B.en){if(!e.alive||e.spawnT>0)continue;const d=dist(P,e),m=P.r+e.r;if(d<m&&d>0){const k=(m-d)/d;P.x+=(P.x-e.x)*k*.5;P.y+=(P.y-e.y)*k*.5;}}
  if(B.core){const d=dist(P,B.core),m=P.r+B.core.r;if(d<m&&d>0){const k=(m-d)/d;P.x+=(P.x-B.core.x)*k;P.y+=(P.y-B.core.y)*k;}}
  P.atkT-=dt;P.comboWin-=dt;P.dashI-=dt;P.dashCd-=dt;P.iT-=dt;P.tagCd-=dt;
  P.skillCd.eden-=dt;P.skillCd.nesis-=dt;
  const o=other();if(P.hp[o]>0)P.hp[o]=Math.min(CH[o].maxhp,P.hp[o]+CH[o].maxhp*0.012*dt);
  if(B.cine)return;
  if(inp.dashP&&P.dashCd<=0)doDash();
  else if(inp.atk&&P.atkT<=0&&P.dashT<=0)doAttack();
  if(inp.skillP&&P.skillCd[P.active]<=0&&P.dashT<=0)doSkill();
  if(inp.tagP&&P.tagCd<=0&&P.hp[o]>0)doTag(false);
  if(inp.linkP&&P.link>=100)doLink();
}
function doAttack(){
  const c=CH[P.active];
  if(P.comboWin<=0)P.combo=0;
  const k=c.combo[P.combo];
  const tg=nearestEnemy(P.x,P.y,230);
  if(tg)P.face=angTo(P,tg);
  P.atkT=k.d;P.atkD=k.d;P.comboWin=k.d+0.45;P.swing=-P.swing;
  P.x+=Math.cos(P.face)*10;P.y+=Math.sin(P.face)*10;
  let hits=0;
  for(const e of B.en){
    if(!e.alive||e.inv||e.spawnT>0)continue;
    const d=dist(P,e);if(d>k.r+e.r)continue;
    if(d>e.r+8&&Math.abs(angDiff(P.face,angTo(P,e)))>k.a/2)continue;
    hitEnemy(e,k.dmg,{kb:P.combo===2?190:90,ang:P.face,col:k.col});hits++;
  }
  B.fx.push({k:'slash',x:P.x,y:P.y,ang:P.face,r:k.r,a:k.a,col:k.col,life:.18,max:.18,dir:P.swing,w:P.active==='nesis'?16:9});

  }

  P.combo=(P.combo+1)%3;
}

function hurtPlayer(dmg,src){
  if(B.over||B.winT>=0)return;
  if(P.dashI>0){if(!P.perfectUsed){P.perfectUsed=true;perfectDodge();}return;}
  if(P.iT>0||B.linkInv>0||B.cine)return;
  dmg=Math.round(dmg*rand(.92,1.08));
  P.hp[P.active]-=dmg;P.iT=0.45;B.stats.taken+=dmg;
  ftxt(P.x,P.y-30,'-'+dmg,'#ff6b8a');B.shake=Math.max(B.shake,6);SFX.hurt();addLink(3);
  if(P.hp[P.active]<=0){P.hp[P.active]=0;
    if(P.hp[other()]>0){bark(other()==='eden'?'이든':'네시스',other()==='eden'?'네시스! ...물러나 있어, 내가 간다.':'이든! 내가 이어받을게!');doTag(true);}
    else lose();}
}
function perfectDodge(){
  B.stats.perfect++;B.slow=0.55;B.slowS=0.3;addLink(12);ftxt(P.x,P.y-46,'완벽 회피!','#bfe9ff',1);SFX.perfect();
  if(B.tut&&B.tut.i===2)B.tut.dodges++;
  if(Math.random()<.4)bark('센티아',pick(['좋아, 그 타이밍이야!','흥, 그 정도는 해야지.','5번 루트, 정확해!']));
}
function hurtAlly(a,dmg){a.hp-=dmg;ftxt(a.x,a.y-26,'-'+Math.round(dmg),'#ffb0a0');if(a.hp<=0){a.hp=0;a.down=7;bark(a.name,'크윽... 잠시만 버텨주십시오!');}}
function hurtCore(dmg){if(!B.core)return;B.core.hp-=dmg;B.core.flash=.15;if(B.core.hp<=0){B.core.hp=0;lose('방어막 발생기가 파괴되었습니다.');}}
function hitEnemy(e,dmg,o){
  if(!e.alive||e.inv)return;
  o=o||{};
  let crit=!o.ally&&Math.random()<.12;
  let d=dmg*(crit?1.6:1)*(e.d.armor||1)*rand(.92,1.08);
  if(e.d.boss&&e.armorBreak)d*=1.3;
  d=Math.max(1,Math.round(d));
  e.hp-=d;e.flash=.1;
  if(!e.d.heavy&&o.kb){e.kx+=Math.cos(o.ang)*o.kb;e.ky+=Math.sin(o.ang)*o.kb;}
  else if(o.kb){e.kx+=Math.cos(o.ang)*o.kb*.08;e.ky+=Math.sin(o.ang)*o.kb*.08;}
  ftxt(e.x+rand(-8,8),e.y-e.r-6,(crit?'✦':'')+d,crit?'#ffe08a':(o.ally?'#ffc2b3':'#ffffff'),crit||o.big);
  for(let i=0;i<(o.ally?2:5);i++)B.fx.push({k:'p',x:e.x,y:e.y,vx:rand(-160,160),vy:rand(-160,160),life:.3,max:.3,col:o.col||'#fff',s:2.5});
  if(!o.ally){B.hitstop=Math.max(B.hitstop,o.big?0.09:0.035);SFX.hit();
    if(!o.nolink)addLink(e.d.boss?2.2:1.5);
    B.combo++;B.comboT=2.2;if(B.combo>B.stats.maxCombo)B.stats.maxCombo=B.combo;}
  if(e.hp<=0)killEnemy(e);
}
function killEnemy(e){
  e.alive=false;e.hp=0;
  const n=e.d.boss?40:14;
  for(let i=0;i<n;i++){const a=rand(0,TAU),s=rand(60,e.d.boss?420:220);B.fx.push({k:'p',x:e.x,y:e.y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:e.d.boss?1:.5,max:e.d.boss?1:.5,col:i%3?e.d.col:'#ffffff',s:e.d.boss?4:3});}
  B.haz=B.haz.filter(h=>h.owner!==e||h.fired);
  if(e.d.boss){
    B.slow=1.2;B.slowS=0.25;B.shake=14;SFX.boom();flash('#fff',.5);
    if(e.type==='abi')bark('아비','아하... 아하하... 파시스 님... 제가, 먼저... 돌아갑...');
    if(e.type==='mor')bark('모르','...오류. 파시스 님... 죄송... 합니...다.');
    if(e.type==='phasis')bark('파시스','이렇게 강한 인간이 존재한다는 이야기는... 듣지 못하였다...');
  }
}

/* ---------- allies ---------- */
function updateAllies(dt){
  for(const a of B.allies){
    if(a.hp<=0){a.down-=dt;if(a.down<=0){a.hp=a.maxhp*.5;bark(a.name,'다시 전열에 합류합니다!');}continue;}
    a.atkCd-=dt;a.swing=Math.max(0,a.swing-dt*4);
    let tg=null,bd=1e9;
    for(const e of B.en){if(!e.alive||e.inv||e.spawnT>0)continue;let d=Math.hypot(e.x-a.x,e.y-a.y);if(e.type==='mor')d*=.4;if(d<bd){bd=d;tg=e;}}
    let tx,ty,want;
    if(tg){tx=tg.x;ty=tg.y;want=tg.r+a.r+12;}else{const i=B.allies.indexOf(a);tx=P.x+Math.cos(i*2.1+1)*70;ty=P.y+Math.sin(i*2.1+1)*70;want=10;}
    const d=Math.hypot(tx-a.x,ty-a.y);
    if(d>want){const s=165*dt;a.x+=(tx-a.x)/d*s;a.y+=(ty-a.y)/d*s;a.face=Math.atan2(ty-a.y,tx-a.x);}
    else if(tg&&a.atkCd<=0){a.atkCd=rand(.8,1.1);a.swing=1;a.face=Math.atan2(ty-a.y,tx-a.x);hitEnemy(tg,a.name==='렉소르'?9:7,{ally:1,kb:60,ang:a.face,col:a.c});}
    a.x=clamp(a.x,20,B.w-20);a.y=clamp(a.y,20,B.h-20);
  }
}

/* ---------- enemies ---------- */
function targets(){
  const L=[{o:P,w:1}];
  for(const a of B.allies)if(a.hp>0)L.push({o:a,w:1.35});
  if(B.core&&B.core.hp>0)L.push({o:B.core,w:.5});
  return L;
}
function pickTarget(e,allyBias){
  let best=P,bd=1e9;
  for(const c of targets()){let w=c.w;if(allyBias&&c.o!==P&&c.o!==B.core)w*=allyBias;const d=Math.hypot(c.o.x-e.x,c.o.y-e.y)*w;if(d<bd){bd=d;best=c.o;}}
  return best;
}
function sched(e,t,fn){e.q.push({t,fn});}
function moveTo(e,x,y,sp,dt,stop){const d=Math.hypot(x-e.x,y-e.y);if(d>(stop||0)){const s=Math.min(d-(stop||0),sp*dt);e.x+=(x-e.x)/d*s;e.y+=(y-e.y)/d*s;}return d;}
function updateEnemies(dt){
  for(const e of B.en){
    if(!e.alive)continue;
    e.t+=dt;e.flash-=dt;
    if(e.spawnT>0){e.spawnT-=dt;continue;}
    e.x+=e.kx*dt;e.y+=e.ky*dt;e.kx*=Math.pow(.002,dt);e.ky*=Math.pow(.002,dt);
    if(e.q.length){for(const q of e.q){q.t-=dt;if(q.t<=0&&!q.done){q.done=1;q.fn();}}e.q=e.q.filter(q=>!q.done);}
    if(e.dash){const D_=e.dash;D_.t+=dt;const k=Math.min(1,D_.t/D_.d);e.x=lerp(D_.x0,D_.x1,k);e.y=lerp(D_.y0,D_.y1,k);
      if(Math.random()<.7)B.fx.push({k:'p',x:e.x,y:e.y,vx:0,vy:0,life:.25,max:.25,col:e.d.col,s:5});if(k>=1)e.dash=null;}
    e.busy-=dt;
    AI[e.d.ai](e,dt);
    e.x=clamp(e.x,e.r,B.w-e.r);e.y=clamp(e.y,e.r,B.h-e.r);
  }
  for(let i=0;i<B.en.length;i++){const a=B.en[i];if(!a.alive||a.dash)continue;
    for(let j=i+1;j<B.en.length;j++){const b=B.en[j];if(!b.alive||b.dash)continue;const dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy),m=a.r+b.r;
      if(d<m&&d>0){const k=(m-d)/d*.5;const wa=a.d.boss?.1:1,wb=b.d.boss?.1:1;a.x-=dx*k*wa;a.y-=dy*k*wa;b.x+=dx*k*wb;b.y+=dy*k*wb;}}}
}
const AI={
  dummy(e,dt){},

          addHaz({k:'line',x:e.x,y:e.y,ang,len,w:34,t:.55,dmg:e.d.dmg,owner:e,coreMul:1.4,fxc:e.d.col,
            onFire:()=>{e.dash={x0:e.x,y0:e.y,x1:clamp(e.x+Math.cos(ang)*len,0,B.w),y1:clamp(e.y+Math.sin(ang)*len,0,B.h),t:0,d:.12};}});}
        else{e.st=.5;addHaz({k:'cone',x:e.x,y:e.y,ang:e.face,r:e.r+52,arc:1.7,t:.5,dmg:e.d.dmg,owner:e,coreMul:1.4,fxc:e.d.col});}

  spitter(e,dt){

      const d=moveTo(e,t.x,t.y,e.d.spd,dt,e.r+40);e.face=Math.atan2(t.y-e.y,t.x-e.x);e.cd-=dt;

/* ---------- projectiles / fields ---------- */
function updateProj(dt){
  for(const b of B.eb){b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;
    if(Math.hypot(b.x-P.x,b.y-P.y)<b.r+P.r*.8){if(P.dashI>0){if(!P.perfectUsed){P.perfectUsed=true;perfectDodge();}}else if(!(P.iT>0||B.linkInv>0)){hurtPlayer(b.dmg);b.life=0;}}
    if(B.core&&Math.hypot(b.x-B.core.x,b.y-B.core.y)<b.r+B.core.r){hurtCore(b.dmg*1.2);b.life=0;}
    for(const a of B.allies)if(a.hp>0&&Math.hypot(b.x-a.x,b.y-a.y)<b.r+a.r){hurtAlly(a,b.dmg*.5);b.life=0;break;}
    if(b.x<0||b.y<0||b.x>B.w||b.y>B.h)b.life=0;}
  B.eb=B.eb.filter(b=>b.life>0);
  for(const b of B.pb){
    if(b.homing){const n=nearestEnemy(b.x,b.y,600);if(n){const a=Math.atan2(n.y-b.y,n.x-b.x);b.vx+=Math.cos(a)*1400*dt;b.vy+=Math.sin(a)*1400*dt;const s=Math.hypot(b.vx,b.vy);if(s>520){b.vx*=520/s;b.vy*=520/s;}}}

    if(b.k==='wave'&&Math.random()<.9)B.fx.push({k:'p',x:b.x+rand(-14,14),y:b.y+rand(-14,14),vx:rand(-30,30),vy:rand(-60,0),life:.35,max:.35,col:pick(['#6cb8ff','#bfe3ff','#3d7dff']),s:4});

    if(f.tick<=0){f.tick=.25;for(const e of B.en)if(e.alive&&e.spawnT<=0&&Math.hypot(f.x-e.x,f.y-e.y)<f.r+e.r)hitEnemy(e,8,{col:'#9b6bff',nolink:false});}

      B.fx.push({k:'ring',x:f.x,y:f.y,r:f.r+60,r2:10,life:.4,max:.4,col:'#b49bff'});B.shake=Math.max(B.shake,7);SFX.boom();}
  }

}

/* ---------- flow ---------- */
function battleUpdate(rdt){
  if(!B)return;
  if(B.cine){B.cine.t+=rdt;if(B.cine.t>=B.cine.dur){B.cine=null;linkImpact();}}
  let dt=rdt;
  if(B.hitstop>0){B.hitstop-=rdt;dt=rdt*.08;}
  if(B.slow>0){B.slow-=rdt;dt*=B.slowS;}
  if(B.cine)dt*=.08;
  B.linkInv-=rdt;
  B.shake=Math.max(0,B.shake-rdt*30);
  B.comboT-=rdt;if(B.comboT<=0)B.combo=0;
  if(B.winT>=0){B.winT-=rdt;dt*=.35;if(B.winT<0){showResult();return;}}
  if(!B.over&&B.winT<0)B.stats.time+=rdt;
  updatePlayer(dt);clearPresses();
  updateAllies(dt);updateEnemies(dt);updateHaz(dt);updateProj(dt);
  for(const f of B.fx){f.life-=dt;if(f.vx!==undefined){f.x+=f.vx*dt;f.y+=f.vy*dt;f.vx*=.92;f.vy*=.92;}}
  B.fx=B.fx.filter(f=>f.life>0);if(B.fx.length>420)B.fx.splice(0,B.fx.length-420);
  for(const t of B.txt){t.life-=rdt;t.y-=40*rdt;}B.txt=B.txt.filter(t=>t.life>0);
  if(B.core&&B.core.flash>0)B.core.flash-=dt;
  // spawning & win
  if(B.over||B.winT>=0)return;
  if(B.tut)tutUpdate(dt);
  if(B.def.waves){
    if(B.spawnQ.length){B.spawnT-=dt;if(B.spawnT<=0){B.spawnT=.45;const p=edgePos();spawn(B.spawnQ.shift(),p.x,p.y);}}
    else if(alive()===0){
      if(B.wave<B.def.waves.length-1){healAll(.15);nextWave();}else win();
    }
  }
  if(B.def.bosses&&B.bossIds.every(e=>!e.alive)){B.en.forEach(e=>{if(e.alive)killEnemy(e);});win();}
}
function healAll(f){for(const k of ['eden','nesis'])if(P.hp[k]>0)P.hp[k]=Math.min(CH[k].maxhp,P.hp[k]+CH[k].maxhp*f);}
function win(){if(B.winT>=0||B.over)return;B.winT=1.6;B.haz=[];B.eb=[];SFX.win();$('banner').classList.remove('on');}
function lose(msg){if(B.over)return;B.over=true;SFX.lose();setTimeout(()=>{if(!B)return;$('oMsg').textContent=msg||'두 사람 모두 쓰러졌습니다.';show('over',true);GS.mode='over';},900);}
function showResult(){
  GS.mode='result';
  const s=B.stats;const t=s.time;
  let score=100-s.taken/12+s.maxCombo/3+s.perfect*2-Math.max(0,t-(B.id==='tut'?150:B.id==='outpost'?150:120))/3;
  const rank=score>=95?'S':score>=75?'A':score>=55?'B':'C';
  $('rRank').textContent=rank;
  $('rStats').innerHTML=`<span>전투 시간</span><b>${Math.floor(t/60)}:${String(Math.floor(t%60)).padStart(2,'0')}</b><span>받은 피해</span><b>${Math.round(s.taken)}</b><span>최대 콤보</span><b>${s.maxCombo}</b><span>완벽 회피</span><b>${s.perfect}</b>`;
  show('hud',false);show('ctrl',false);show('pauseB',false);show('result',true);
}

  }else if(e.type==='spitter'){
    ctx.fillStyle='#3a2c52';ell(0,0,e.r*1.1,e.r*.85);ctx.fillStyle=`rgba(190,120,255,${.5+.4*Math.sin(t*6)+(e.charge>0?.5:0)})`;ell(-Math.cos(f)*4,-6,e.r*.55,e.r*.45);
    ctx.fillStyle='#7cff9e';ctx.fillRect(Math.cos(f)*8-2,Math.sin(f)*8-2,4,4);
  }else if(e.type==='brute'){
    ctx.fillStyle='#4a505e';ctx.beginPath();for(let i=0;i<6;i++){const a=i/6*TAU+PI/6;ctx.lineTo(Math.cos(a)*e.r,Math.sin(a)*e.r*.9);}ctx.closePath();ctx.fill();
    ctx.strokeStyle='#9aa3b5';ctx.lineWidth=3;ctx.stroke();ctx.fillStyle='#ff5c3b';ctx.beginPath();ctx.arc(Math.cos(f)*10,Math.sin(f)*10-4,4,0,TAU);ctx.fill();
  }else if(e.type==='abi'){
    ctx.fillStyle='rgba(180,108,255,.25)';ell(0,0,e.r*1.6,e.r*1.6);
    ctx.fillStyle='#2a1640';ctx.beginPath();ctx.moveTo(-12,14);ctx.lineTo(0,-14);ctx.lineTo(12,14);ctx.fill();
    ctx.fillStyle='#e8d2ff';ctx.beginPath();ctx.arc(0,-18,7,0,TAU);ctx.fill();ctx.fillStyle='#4b2a7a';ctx.beginPath();ctx.arc(0,-20,7.5,PI,TAU);ctx.fill();
    ctx.save();ctx.rotate(f);ctx.strokeStyle='#d9b8ff';ctx.lineWidth=2.5;ctx.shadowColor='#b46cff';ctx.shadowBlur=10;ctx.beginPath();ctx.moveTo(-18,0);ctx.lineTo(48,0);ctx.stroke();
    ctx.fillStyle='#f3e6ff';ctx.beginPath();ctx.moveTo(48,-4);ctx.lineTo(60,0);ctx.lineTo(48,4);ctx.fill();ctx.restore();
  }else if(e.type==='mor'){
    ctx.fillStyle='#14141c';ctx.beginPath();ctx.roundRect?ctx.roundRect(-20,-22,40,40,8):ctx.rect(-20,-22,40,40);ctx.fill();
    ctx.strokeStyle='#8a5cff';ctx.lineWidth=1.5;ctx.globalAlpha*=.9;for(let i=0;i<3;i++){ctx.beginPath();ctx.moveTo(-14+i*14,-18);ctx.lineTo(-10+i*14,14);ctx.stroke();}
    ctx.fillStyle='#2a2a36';ctx.beginPath();ctx.arc(0,-30,11,0,TAU);ctx.fill();ctx.fillStyle='#b46cff';ctx.fillRect(-6,-32,12,3);
    ctx.save();ctx.rotate(f+(e.busy>0?-.8:0));ctx.fillStyle='#3a3a4a';ctx.fillRect(10,-6,64,12);ctx.fillStyle='#9a9ab8';ctx.fillRect(14,-2,56,4);ctx.restore();
  }else if(e.type==='phasis'){
    const wing=e.wing||0;ctx.translate(0,Math.sin(t*2)*4-10);
    for(let i=0;i<18;i++){const s=i<9?-1:1,k=i%9;const a=-PI/2+s*(.5+k*.2+Math.sin(wing*2+k)*.05);const L=50+k*6;
      ctx.strokeStyle=`rgba(230,205,255,${.5+.05*k})`;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(Math.cos(a)*14,Math.sin(a)*14);ctx.lineTo(Math.cos(a)*L,Math.sin(a)*L);ctx.stroke();
      ctx.fillStyle='#fff';ctx.fillRect(Math.cos(a)*L-1.5,Math.sin(a)*L-1.5,3,3);}
    ctx.fillStyle='rgba(200,130,255,.35)';ell(0,0,30,30);
    const g=ctx.createLinearGradient(0,-24,0,24);g.addColorStop(0,'#f2e6ff');g.addColorStop(1,'#6a3fa0');ctx.fillStyle=g;
    ctx.beginPath();ctx.moveTo(-10,24);ctx.lineTo(-6,-10);ctx.lineTo(6,-10);ctx.lineTo(10,24);ctx.fill();
    ctx.fillStyle='#f7efff';ctx.beginPath();ctx.arc(0,-18,8,0,TAU);ctx.fill();ctx.fillStyle='#c084fc';ctx.fillRect(-5,-20,3,2);ctx.fillRect(2,-20,3,2);
    if(e.rage){ctx.strokeStyle='rgba(255,90,160,.6)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,0,40+Math.sin(t*8)*4,0,TAU);ctx.stroke();}
  }
  if(e.flash>0){ctx.globalCompositeOperation='lighter';ctx.fillStyle='rgba(255,255,255,.6)';ell(0,-4,e.r,e.r);}
  ctx.restore();
  if(!d.boss&&e.hp<e.maxhp&&e.spawnT<=0){ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(e.x-16,e.y-e.r-12,32,4);ctx.fillStyle='#ff5a7a';ctx.fillRect(e.x-16,e.y-e.r-12,32*e.hp/e.maxhp,4);}
}
function drawCore(c){
  ctx.save();ctx.translate(c.x,c.y);
  ctx.fillStyle='rgba(0,0,0,.4)';ell(0,22,40,12);
  ctx.fillStyle=c.flash>0?'#fff':'#3a3f4c';ctx.beginPath();for(let i=0;i<6;i++){const a=i/6*TAU;ctx.lineTo(Math.cos(a)*c.r,Math.sin(a)*c.r*.8);}ctx.closePath();ctx.fill();
  ctx.strokeStyle='#ffb36b';ctx.lineWidth=2;ctx.stroke();
  ctx.fillStyle='#ffcf7a';ctx.beginPath();ctx.arc(0,-8,10+Math.sin(GS.t*4)*2,0,TAU);ctx.fill();
  ctx.strokeStyle=`rgba(255,200,120,${.15+.1*Math.sin(GS.t*3)})`;ctx.setLineDash([6,8]);ctx.beginPath();ctx.arc(0,0,80,0,TAU);ctx.stroke();ctx.setLineDash([]);
  ctx.restore();
}
function drawFx(f){
  const k=f.life/f.max;
  if(f.k==='p'){ctx.globalAlpha=k;ctx.fillStyle=f.col;ctx.fillRect(f.x-f.s/2,f.y-f.s/2,f.s,f.s);ctx.globalAlpha=1;}
  else if(f.k==='slash'){ctx.save();ctx.translate(f.x,f.y);ctx.globalAlpha=k;ctx.strokeStyle=f.col;ctx.lineWidth=f.w*k+2;ctx.shadowColor=f.col;ctx.shadowBlur=14;
    const s=f.ang-f.a/2,e=f.ang+f.a/2,p=1-k;ctx.beginPath();if(f.dir>0)ctx.arc(0,0,f.r*.85,s,lerp(s,e,Math.min(1,p*3)));else ctx.arc(0,0,f.r*.85,lerp(e,s,Math.min(1,p*3)),e);ctx.stroke();ctx.restore();}
  else if(f.k==='ring'){ctx.save();ctx.globalAlpha=k;ctx.strokeStyle=f.col;ctx.lineWidth=4;const lo=Math.min(f.r,f.r2),hi=Math.max(f.r,f.r2),p=1-k;const r=f.inward?lerp(hi,lo,p):lerp(lo,hi,p);ctx.beginPath();ctx.arc(f.x,f.y,Math.max(1,r),0,TAU);ctx.stroke();ctx.restore();}
  else if(f.k==='bolt'){ctx.save();ctx.globalAlpha=k;ctx.strokeStyle=f.col;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(f.x1,f.y1);
    for(let i=1;i<6;i++){const t=i/6;ctx.lineTo(lerp(f.x1,f.x2,t)+rand(-8,8),lerp(f.y1,f.y2,t)+rand(-8,8));}ctx.lineTo(f.x2,f.y2);ctx.stroke();ctx.restore();}
  else if(f.k==='ghost'){drawHero(f.x,f.y,f.who,f.face,{alpha:k*.5,ghost:1});}
}
function render(){
  const cam=B.cam;
  const vw=W/ZOOM,vh=H/ZOOM;
  const tx=B.w<=vw?B.w/2:clamp(P.x,vw/2,B.w-vw/2),ty=B.h<=vh?B.h/2:clamp(P.y,vh/2,B.h-vh/2);
  cam.x=lerp(cam.x,tx,.15);cam.y=lerp(cam.y,ty,.15);
  ctx.setTransform(DPR,0,0,DPR,0,0);ctx.fillStyle='#030207';ctx.fillRect(0,0,W,H);
  const sx=(Math.random()-.5)*B.shake,sy=(Math.random()-.5)*B.shake;
  ctx.setTransform(DPR*ZOOM,0,0,DPR*ZOOM,(W/2-cam.x*ZOOM+sx)*DPR,(H/2-cam.y*ZOOM+sy)*DPR);
  drawArena();
  for(const h of B.haz)drawHazard(h);
  for(const f of B.fields){ctx.save();const g=ctx.createRadialGradient(f.x,f.y,4,f.x,f.y,f.r);g.addColorStop(0,'rgba(0,0,0,.95)');g.addColorStop(.6,'rgba(50,10,90,.6)');g.addColorStop(1,'rgba(150,100,255,.08)');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(f.x,f.y,f.r,0,TAU);ctx.fill();ctx.strokeStyle='rgba(190,150,255,.7)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(f.x,f.y,f.r*(.95+.05*Math.sin(f.t*12)),0,TAU);ctx.stroke();ctx.restore();}
  if(B.core)drawCore(B.core);
  const list=[];
  for(const e of B.en)if(e.alive)list.push({y:e.y,f:()=>drawEnemy(e)});
  for(const a of B.allies)list.push({y:a.y,f:()=>drawAlly(a)});
  list.push({y:P.y,f:()=>{
    if(P.iT>0&&P.dashI<=0&&B.linkInv<=0&&Math.floor(GS.t*20)%2)ctx.globalAlpha=.5;
    drawHero(P.x,P.y,P.active,P.face,{atk:P.atkT>0?P.atkT/P.atkD:0,swing:P.swing});ctx.globalAlpha=1;
    if(B.linkInv>0){ctx.strokeStyle='rgba(220,200,255,.6)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(P.x,P.y-6,26+Math.sin(GS.t*10)*2,0,TAU);ctx.stroke();}
  }});
  list.sort((a,b)=>a.y-b.y);for(const l of list)l.f();
  for(const b of B.eb){ctx.fillStyle=b.col;if(b.needle){ctx.save();ctx.translate(b.x,b.y);ctx.rotate(Math.atan2(b.vy,b.vx));ctx.fillRect(-9,-1.5,18,3);ctx.restore();}else{ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,TAU);ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=1;ctx.stroke();}}
  for(const b of B.pb){if(b.k==='wave'){ctx.save();ctx.translate(b.x,b.y);ctx.rotate(b.ang);ctx.strokeStyle='#8fc8ff';ctx.lineWidth=6;ctx.shadowColor='#3d7dff';ctx.shadowBlur=14;ctx.beginPath();ctx.arc(-10,0,26,-1,1);ctx.stroke();ctx.restore();}
    else{ctx.fillStyle=b.col;ctx.shadowColor='#bfe3ff';ctx.shadowBlur=10;ctx.beginPath();ctx.arc(b.x,b.y,b.r*.7,0,TAU);ctx.fill();ctx.shadowBlur=0;}}
  for(const f of B.fx)drawFx(f);
  for(const t of B.txt){ctx.globalAlpha=Math.min(1,t.life/t.max*2);ctx.fillStyle=t.col;ctx.font=`900 ${t.big?18:13}px sans-serif`;ctx.textAlign='center';ctx.strokeStyle='rgba(0,0,0,.7)';ctx.lineWidth=3;ctx.strokeText(t.s,t.x,t.y);ctx.fillText(t.s,t.x,t.y);}
  ctx.globalAlpha=1;
  // screen space overlays
  ctx.setTransform(DPR,0,0,DPR,0,0);
  const hpk=P.hp[P.active]/CH[P.active].maxhp;
  if(hpk<.3){const g=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*.3,W/2,H/2,Math.max(W,H)*.7);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,`rgba(200,0,40,${.25+.15*Math.sin(GS.t*6)})`);ctx.fillStyle=g;ctx.fillRect(0,0,W,H);}
  if(B.slow>0){ctx.fillStyle='rgba(120,180,255,.08)';ctx.fillRect(0,0,W,H);}
  if(B.cine)drawCine();
}
function drawCine(){
  const k=B.cine.t/B.cine.dur,m=Math.min(W,H);
  ctx.fillStyle=`rgba(4,2,12,${Math.min(.75,k*2)})`;ctx.fillRect(0,0,W,H);
  const cx=W/2,cy=H*.46;
  ctx.save();ctx.translate(cx,cy);
  for(let i=0;i<5;i++){ctx.save();ctx.rotate(GS.t*.8+i*TAU/5);ctx.strokeStyle=`rgba(180,140,255,${.7*k})`;ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(m*.1,0,m*.14*k+10,m*.14*k+10,0,0,TAU);ctx.stroke();ctx.restore();}
  for(let i=0;i<12;i++){ctx.save();ctx.rotate(-GS.t*.5+i*TAU/12);ctx.fillStyle=`rgba(190,235,255,${.35*k})`;ctx.beginPath();ctx.ellipse(m*.2*k+20,0,m*.07,m*.02,0,0,TAU);ctx.fill();ctx.restore();}
  ctx.restore();
  ctx.save();ctx.translate(cx,cy);const sc=Math.min(2.2,m/250);ctx.scale(sc,sc);
  drawHero(-30,10,'eden',PI,{});drawHero(30,10,'nesis',0,{});ctx.restore();
  ctx.fillStyle='#fff';ctx.textAlign='center';ctx.font=`900 ${Math.max(18,m*.06)}px sans-serif`;ctx.globalAlpha=Math.min(1,k*3);
  ctx.shadowColor='#b49bff';ctx.shadowBlur=18;ctx.fillText('링크 0 : 공허 & 흡융',cx,cy+m*.3);ctx.shadowBlur=0;
  ctx.font=`600 ${Math.max(11,m*.025)}px sans-serif`;ctx.fillStyle='#cfc6ff';ctx.fillText('LINK 0 — VOID × FUSION',cx,cy+m*.3+m*.05);
  ctx.globalAlpha=1;
}

/* ---------------- main loop ---------------- */
let last=performance.now();
function frame(now){
  let rdt=Math.min(.05,(now-last)/1000);last=now;
  if(GS.paused)rdt=0;
  GS.t+=rdt;
  try{
    if(GS.mode==='battle'||GS.mode==='over'||(GS.mode==='result'&&B)){
      if(B){if(GS.mode==='battle')battleUpdate(rdt);render();updateHud();}
    }else{
      drawBg(GS.bg,GS.t);
      dlgUpdate(rdt);
    }
  }catch(err){console.error(err);}
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
window.ASDBG={GS,get B(){return B},get P(){return P},inp,startBattle,startChapter,nextStep,skipToAction,run,SAVE};

</script>
